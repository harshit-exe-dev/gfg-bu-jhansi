<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f0c">
<title>HTML Quiz — GFG Campus Body, BU Jhansi</title>
<style>
  :root { --bg: #0b0f0c; --panel: #111713; --green: #2f8d46; --ink: #eef3ee; --mut: #93a196; --line: #223026; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif;
         min-height: 100vh; display: flex; justify-content: center; padding: 24px 16px 60px; }
  .wrap { width: 100%; max-width: 560px; }
  .brand { text-align: center; margin-bottom: 26px; }
  .brand .k { color: var(--green); letter-spacing: 4px; font-size: 12px; font-weight: 700; }
  .brand h1 { font-size: 30px; margin-top: 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px 22px; }
  .screen { display: none; } .screen.on { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }
  label { display: block; color: var(--mut); font-size: 13px; letter-spacing: 2px; margin: 16px 0 8px; }
  label:first-child { margin-top: 0; }
  input, select { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: #0d120e; color: var(--ink); font-size: 16px; }
  input:focus, select:focus { outline: 2px solid var(--green); border-color: var(--green); }
  .btn { display: block; width: 100%; margin-top: 22px; padding: 15px; border: none; border-radius: 12px;
    background: var(--green); color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); margin-top: 12px; }
  .err { color: #e06c6c; font-size: 14px; margin-top: 10px; min-height: 20px; }
  /* quiz */
  .progress { height: 8px; background: #1a221c; border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
  .progress i { display: block; height: 100%; background: var(--green); width: 0; transition: width .3s; }
  .qmeta { display: flex; justify-content: space-between; color: var(--mut); font-size: 13px; margin-bottom: 18px; }
  .q { font-size: 21px; line-height: 1.5; margin-bottom: 18px; }
  .opt { display: block; width: 100%; text-align: left; margin: 10px 0; padding: 14px 16px;
    border-radius: 10px; border: 1px solid var(--line); background: #0d120e; color: var(--ink);
    font-size: 16px; cursor: pointer; font-family: Consolas, monospace; }
  .opt:active { border-color: var(--green); }
  .opt.picked { border-color: var(--green); background: #12240f; }
  /* result */
  .score { font-size: 64px; font-weight: 800; text-align: center; color: var(--green); }
  .score small { font-size: 22px; color: var(--mut); }
  .rankline { text-align: center; color: var(--mut); margin: 10px 0 4px; font-size: 16px; }
  /* leaderboard */
  table { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 8px; }
  th { text-align: left; color: var(--mut); font-size: 12px; letter-spacing: 2px; padding: 10px 8px;
       border-bottom: 1px solid var(--line); }
  td { padding: 11px 8px; border-bottom: 1px solid #182019; }
  tr.me td { background: #12240f; font-weight: 700; }
  tr.me td:first-child { border-radius: 8px 0 0 8px; } tr.me td:last-child { border-radius: 0 8px 8px 0; }
  .gold { color: #e8c468; font-weight: 800; }
  .empty { text-align: center; color: var(--mut); padding: 30px 0; }
  .foot { text-align: center; color: var(--mut); font-size: 12px; letter-spacing: 3px; margin-top: 34px; }
</style>
</head>
<body>
<noscript><div style="background:#3a1414;color:#ffb4b4;padding:14px 16px;border-radius:10px;margin-bottom:16px;text-align:center;font-size:15px">⚠️ This quiz needs JavaScript turned on in your browser to work.</div></noscript>
<div class="wrap">
  <div class="brand">
    <div class="k">GEEKSFORGEEKS · CAMPUS BODY</div>
    <h1>HTML Quiz</h1>
  </div>

  <!-- entry -->
  <div class="card screen on" id="s-entry">
    <label>YOUR NAME</label>
    <input id="f-name" maxlength="40" placeholder="e.g. Harshit Bharti" autocomplete="off">
    <label>BRANCH</label>
    <select id="f-branch">
      <option value="">Select branch…</option>
      <option>CSE</option><option>ECE</option><option>ME</option><option>EI</option>
      <option>Biotech Eng.</option><option>Biomedical Eng.</option>
      <option>Foodtech Eng.</option><option>Other</option>
    </select>
    <label>YEAR</label>
    <select id="f-year">
      <option value="">Select year…</option>
      <option value="1">1st year</option><option value="2">2nd year</option>
      <option value="3">3rd year</option><option value="4">4th year</option>
    </select>
    <div class="err" id="entry-err"></div>
    <div id="diag" style="font-size:12px; text-align:center; margin-top:8px; color:var(--mut)">loading quiz engine…</div>
    <button class="btn" id="btn-start">Start quiz →</button>
    <p style="color:var(--mut); font-size:13px; text-align:center; margin-top:14px">10 questions · from today's session · fastest wins ties</p>
  </div>

  <!-- quiz -->
  <div class="card screen" id="s-quiz">
    <div class="progress"><i id="pbar"></i></div>
    <div class="qmeta"><span id="qnum">Question 1 of 10</span><span id="qtimer">0:00</span></div>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
  </div>

  <!-- result -->
  <div class="card screen" id="s-result">
    <div class="score"><span id="r-score">0</span><small>/10</small></div>
    <div class="rankline" id="r-rank">Calculating your rank…</div>
    <div class="rankline" style="font-size:14px" id="r-time"></div>
    <button class="btn" id="btn-board">See leaderboard →</button>
    <button class="btn ghost" id="btn-retry">Retake quiz</button>
  </div>

  <!-- leaderboard -->
  <div class="card screen" id="s-board">
    <h2 style="margin-bottom:6px">Leaderboard</h2>
    <p style="color:var(--mut); font-size:13px">Top 20 · ties broken by fastest time</p>
    <div id="board"></div>
    <button class="btn ghost" id="btn-refresh">↻ Refresh</button>
    <button class="btn ghost" id="btn-again">Take the quiz again</button>
  </div>

  <div class="foot">CODE · COLLABORATE · INNOVATE</div>
</div>

<script src="/quiz.js"></script>
<script src="/quiz-diag.js"></script>
</body>
</html>
