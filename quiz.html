<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f0c">
<title>HTML Quiz — GFG Campus Body, BU Jhansi</title>
<style>
  :root { --bg: #0b0f0c; --panel: #111713; --green: #2f8d46; --ink: #eef3ee; --mut: #93a196; --line: #223026; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif;
         min-height: 100vh; display: flex; justify-content: center; padding: 24px 16px 60px; }
  .wrap { width: 100%; max-width: 560px; }
  .brand { text-align: center; margin-bottom: 26px; }
  .brand .k { color: var(--green); letter-spacing: 4px; font-size: 12px; font-weight: 700; }
  .brand h1 { font-size: 30px; margin-top: 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px 22px; }
  .screen { display: none; } .screen.on { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }
  label { display: block; color: var(--mut); font-size: 13px; letter-spacing: 2px; margin: 16px 0 8px; }
  label:first-child { margin-top: 0; }
  input, select { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: #0d120e; color: var(--ink); font-size: 16px; }
  input:focus, select:focus { outline: 2px solid var(--green); border-color: var(--green); }
  .btn { display: block; width: 100%; margin-top: 22px; padding: 15px; border: none; border-radius: 12px;
    background: var(--green); color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); margin-top: 12px; }
  .err { color: #e06c6c; font-size: 14px; margin-top: 10px; min-height: 20px; }
  /* quiz */
  .progress { height: 8px; background: #1a221c; border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
  .progress i { display: block; height: 100%; background: var(--green); width: 0; transition: width .3s; }
  .qmeta { display: flex; justify-content: space-between; color: var(--mut); font-size: 13px; margin-bottom: 18px; }
  .q { font-size: 21px; line-height: 1.5; margin-bottom: 18px; }
  .opt { display: block; width: 100%; text-align: left; margin: 10px 0; padding: 14px 16px;
    border-radius: 10px; border: 1px solid var(--line); background: #0d120e; color: var(--ink);
    font-size: 16px; cursor: pointer; font-family: Consolas, monospace; }
  .opt:active { border-color: var(--green); }
  .opt.picked { border-color: var(--green); background: #12240f; }
  /* result */
  .score { font-size: 64px; font-weight: 800; text-align: center; color: var(--green); }
  .score small { font-size: 22px; color: var(--mut); }
  .rankline { text-align: center; color: var(--mut); margin: 10px 0 4px; font-size: 16px; }
  /* leaderboard */
  table { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 8px; }
  th { text-align: left; color: var(--mut); font-size: 12px; letter-spacing: 2px; padding: 10px 8px;
       border-bottom: 1px solid var(--line); }
  td { padding: 11px 8px; border-bottom: 1px solid #182019; }
  tr.me td { background: #12240f; font-weight: 700; }
  tr.me td:first-child { border-radius: 8px 0 0 8px; } tr.me td:last-child { border-radius: 0 8px 8px 0; }
  .gold { color: #e8c468; font-weight: 800; }
  .empty { text-align: center; color: var(--mut); padding: 30px 0; }
  .foot { text-align: center; color: var(--mut); font-size: 12px; letter-spacing: 3px; margin-top: 34px; }
</style>
</head>
<body>
<noscript><div style="background:#3a1414;color:#ffb4b4;padding:14px 16px;border-radius:10px;margin-bottom:16px;text-align:center;font-size:15px">⚠️ This quiz needs JavaScript turned on in your browser to work.</div></noscript>
<div class="wrap">
  <div class="brand">
    <div class="k">GEEKSFORGEEKS · CAMPUS BODY</div>
    <h1>HTML Quiz</h1>
  </div>

  <!-- entry -->
  <div class="card screen on" id="s-entry">
    <label>YOUR NAME</label>
    <input id="f-name" maxlength="40" placeholder="e.g. Aarav Sharma" autocomplete="off">
    <label>BRANCH</label>
    <select id="f-branch">
      <option value="">Select branch…</option>
      <option>CSE</option><option>ECE</option><option>ME</option><option>EI</option>
      <option>Biotech Eng.</option><option>Biomedical Eng.</option>
      <option>Foodtech Eng.</option><option>Other</option>
    </select>
    <label>YEAR</label>
    <select id="f-year">
      <option value="">Select year…</option>
      <option value="1">1st year</option><option value="2">2nd year</option>
      <option value="3">3rd year</option><option value="4">4th year</option>
    </select>
    <div class="err" id="entry-err"></div>
    <button class="btn" id="btn-start">Start quiz →</button>
    <p style="color:var(--mut); font-size:13px; text-align:center; margin-top:14px">10 questions · from today's session · fastest wins ties</p>
  </div>

  <!-- quiz -->
  <div class="card screen" id="s-quiz">
    <div class="progress"><i id="pbar"></i></div>
    <div class="qmeta"><span id="qnum">Question 1 of 10</span><span id="qtimer">0:00</span></div>
    <div class="q" id="qtext"></div>
    <div id="opts"></div>
  </div>

  <!-- result -->
  <div class="card screen" id="s-result">
    <div class="score"><span id="r-score">0</span><small>/10</small></div>
    <div class="rankline" id="r-rank">Calculating your rank…</div>
    <div class="rankline" style="font-size:14px" id="r-time"></div>
    <button class="btn" id="btn-board">See leaderboard →</button>
    <button class="btn ghost" id="btn-retry">Retake quiz</button>
  </div>

  <!-- leaderboard -->
  <div class="card screen" id="s-board">
    <h2 style="margin-bottom:6px">Leaderboard</h2>
    <p style="color:var(--mut); font-size:13px">Top 20 · ties broken by fastest time</p>
    <div id="board"></div>
    <button class="btn ghost" id="btn-refresh">↻ Refresh</button>
    <button class="btn ghost" id="btn-again">Take the quiz again</button>
  </div>

  <div class="foot">CODE · COLLABORATE · INNOVATE</div>
</div>

<script>
// Every question below is from the session slides — nothing outside them.
const QUESTIONS = [
  { q: "What does HTML stand for?",
    o: ["HyperText Markup Language", "HighText Machine Language", "Hyperlink Text Mode Language", "Home Tool Markup Language"], a: 0 },
  { q: "Which tag makes the biggest heading?",
    o: ["<h6>", "<heading>", "<h1>", "<head>"], a: 2 },
  { q: "How many <h1> tags should a page have?",
    o: ["As many as you want", "One — it's the page's title", "Exactly six", "None, h1 is outdated"], a: 1 },
  { q: "Which is the correct way to make a link?",
    o: ['<link href="url">text</link>', '<a href="url">text</a>', '<a link="url">text</a>', '<href url="url">text</href>'], a: 1 },
  { q: "Which attribute gives the image file in an <img> tag?",
    o: ["href", "link", "src", "path"], a: 2 },
  { q: "Why do we write alt text on images?",
    o: ["It makes images load faster", "It shows if the image fails, and screen readers read it aloud", "It is required for the image to display", "It adds a caption under the image"], a: 1 },
  { q: "Which tag makes a bulleted (unordered) list?",
    o: ["<ol>", "<li>", "<ul>", "<list>"], a: 2 },
  { q: "Which input type shows a calendar picker?",
    o: ['type="calendar"', 'type="date"', 'type="day"', 'type="picker"'], a: 1 },
  { q: "Radio buttons only work as a group when they share the same…",
    o: ["id", "value", "name", "class"], a: 2 },
  { q: "Which tag defines a row in a table?",
    o: ["<td>", "<th>", "<tr>", "<table-row>"], a: 2 },
];

const $ = id => document.getElementById(id);
const state = { who: null, order: [], idx: 0, score: 0, t0: 0, myId: null, timer: null };

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  $(id).classList.add('on');
  window.scrollTo(0, 0);
}
function fmtTime(sec) {
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}
function esc(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---- entry ----
$('btn-start').onclick = () => {
  const name = $('f-name').value.trim();
  const branch = $('f-branch').value;
  const year = $('f-year').value;
  const err = $('entry-err');
  if (!name) { err.textContent = 'Please enter your name.'; return; }
  if (!branch) { err.textContent = 'Please pick your branch.'; return; }
  if (!year) { err.textContent = 'Please pick your year.'; return; }
  err.textContent = '';
  state.who = { name, branch, year };
  startQuiz();
};

// ---- quiz ----
function startQuiz() {
  state.order = shuffle(QUESTIONS.map((q, i) => i));
  state.idx = 0; state.score = 0; state.myId = null;
  state.t0 = Date.now();
  clearInterval(state.timer);
  state.timer = setInterval(() => {
    $('qtimer').textContent = fmtTime(Math.floor((Date.now() - state.t0) / 1000));
  }, 1000);
  renderQ();
  show('s-quiz');
}

function renderQ() {
  const qi = state.order[state.idx];
  const Q = QUESTIONS[qi];
  $('pbar').style.width = (state.idx / QUESTIONS.length * 100) + '%';
  $('qnum').textContent = `Question ${state.idx + 1} of ${QUESTIONS.length}`;
  $('qtext').textContent = Q.q;
  const box = $('opts');
  box.innerHTML = '';
  const order = shuffle(Q.o.map((text, i) => ({ text, correct: i === Q.a })));
  order.forEach(({ text, correct }) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = text;
    b.onclick = () => {
      if (b.classList.contains('picked')) return;
      b.classList.add('picked');
      if (correct) state.score++;
      setTimeout(() => {
        state.idx++;
        if (state.idx < QUESTIONS.length) renderQ();
        else finishQuiz();
      }, 320);
    };
    box.appendChild(b);
  });
}

async function finishQuiz() {
  clearInterval(state.timer);
  $('pbar').style.width = '100%';
  const durationSec = Math.floor((Date.now() - state.t0) / 1000);
  $('r-score').textContent = state.score;
  $('r-time').textContent = `Finished in ${fmtTime(durationSec)}`;
  $('r-rank').textContent = 'Saving your score…';
  show('s-result');
  try {
    const r = await fetch('/api/quiz-submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...state.who, score: state.score, durationSec }),
    });
    const d = await r.json();
    if (d.ok) {
      state.myId = d.id;
      const board = await loadBoard();
      const me = board.findIndex(x => x.id === d.id);
      $('r-rank').textContent = me >= 0
        ? `You ranked #${me + 1} on the leaderboard 🏆`
        : 'Score saved — check the leaderboard!';
    } else {
      $('r-rank').textContent = 'Score could not be saved — try again.';
    }
  } catch (e) {
    $('r-rank').textContent = 'Network hiccup — your score may not be saved.';
  }
}

// ---- leaderboard ----
async function loadBoard() {
  const r = await fetch('/api/quiz-leaderboard');
  const d = await r.json();
  return d.ok ? d.board : [];
}

async function renderBoard() {
  const box = $('board');
  box.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const board = await loadBoard();
    if (!board.length) { box.innerHTML = '<div class="empty">No scores yet — be the first!</div>'; return; }
    let html = '<table><tr><th>#</th><th>Name</th><th>Branch · Yr</th><th>Score</th><th>Time</th></tr>';
    board.forEach(x => {
      const medal = x.rank <= 3 ? ' class="gold"' : '';
      const me = x.id === state.myId ? ' class="me"' : '';
      html += `<tr${me}><td${medal}>${x.rank}</td><td>${esc(x.name)}</td>` +
              `<td>${esc(x.branch)} · ${esc(x.year)}${x.year === '1' ? 'st' : x.year === '2' ? 'nd' : x.year === '3' ? 'rd' : 'th'}</td>` +
              `<td>${x.score}/10</td><td>${fmtTime(x.durationSec)}</td></tr>`;
    });
    box.innerHTML = html + '</table>';
  } catch (e) {
    box.innerHTML = '<div class="empty">Could not load the leaderboard. Check your connection.</div>';
  }
}

$('btn-board').onclick = () => { renderBoard(); show('s-board'); };
$('btn-refresh').onclick = renderBoard;
$('btn-retry').onclick = startQuiz;
$('btn-again').onclick = () => { show('s-entry'); };
</script>
</body>
</html>
